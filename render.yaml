services:
  - type: web
    name: council-service-api
    env: python
    region: oregon
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt && flask db upgrade && python scripts/seed_data.py"
    startCommand: "cd backend && gunicorn 'app:create_app()'"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: council-service-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.9.6

databases:
  - name: council-service-db
    plan: free
    region: oregon